name: Publish project hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project source
        uses: actions/checkout@v6
        with:
          sparse-checkout: github-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload project hub
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
